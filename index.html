<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style/style.css">
    <title>Gallery</title>
</head>
<body>


    <div class="show-my-gallery gallery-visibility">
        <div class="popup-close">
            <p>X</p>
        </div>
        <img src="" alt="">
        <div class="arrow-left"></div>
        <div class="arrow-right"></div>
    </div>



    <div class="add-hero-container">
        <div class="close-hero-panel">X</div>
        <div class="hero-list">

        
        </div>
    </div>



    <div class="button-container">
        <button class="show-gallery">
            <span class="tooltip-bottom">Pokaż galerię</span>
        </button>
        <button class="add-character">
            <span class="tooltip-bottom">Dodaj bohatera</span>
        </button>
        <button class="swap-places">
            <span class="tooltip-bottom">Zamień miejscami</span>
        </button>
    </div>


    <div class="background-gradient">
        <div class="corkboard">

            <div class="gallery-row">
                <div class="photo">
                    <img src="img/saitama.jpg">
                    <p class="description"></p>
                    <p class="rank">Rank #1</p>
                </div>
                <div class="photo">
                    <img src="img/one_punch_man.jpg">
                    <p class="description"></p>
                    <p class="rank">Rank #2</p>
                </div>
                <div class="photo">
                    <img src="img/one_punch_man.jpg">
                    <p class="description"></p>
                    <p class="rank">Rank #3</p>
                </div>
                <div class="photo">
                    <img src="img/one_punch_man.jpg">
                    <p class="description"></p>
                    <p class="rank">Rank #4</p>
                </div>
            </div>

            <div class="gallery-row second-gallery-row">
                <div class="photo">
                    <img src="img/one_punch_man.jpg">
                    <p class="description"></p>
                    <p class="rank">Rank #5</p>
                </div>
                <div class="photo">
                    <img src="img/one_punch_man.jpg">
                    <p class="description"></p>
                    <p class="rank">Rank #6</p>
                </div>
            </div>

            

            <div class="gallery-row">
                <div class="photo">
                    <img src="img/one_punch_man.jpg">
                    <p class="description"></p>
                    <p class="rank">Rank #7</p>
                </div>
                <div class="photo">
                    <img src="img/one_punch_man.jpg">
                    <p class="description"></p>
                    <p class="rank">Rank #8</p>
                </div>
                <div class="photo">
                    <img src="img/one_punch_man.jpg">
                    <p class="description"></p>
                    <p class="rank">Rank #9</p>
                </div>
                <div class="photo">
                    <img src="img/one_punch_man.jpg">
                    <p class="description"></p>
                    <p class="rank">Rank #10</p>
                </div>
            </div>
        </div>


    </div>
    

    <script type="module" src="dist/app.js"></script>

</body>
</html>
